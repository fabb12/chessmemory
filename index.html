    <title>ChessMemoryBen</title>
    <script>
      // Applica il tema prima del primo paint per evitare il lampo chiaro/scuro.
      try {
        var t = localStorage.getItem('cm-theme');
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ChessMemoryBen richiede JavaScript per funzionare.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
