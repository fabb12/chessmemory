name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo TypeScript
        run: npm run typecheck

      - name: Test unitari e dei componenti
        run: npm run test

      - name: Build di produzione
        run: npm run build

      - name: Installa Chromium per Playwright
        # Solo il browser: le librerie di sistema sono già presenti sui runner GitHub
        # (evita il download di pacchetti apt, che può fallire per problemi di rete).
        run: npx playwright install chromium

      - name: Test end-to-end
        run: npx playwright test

      - name: Carica il report Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
